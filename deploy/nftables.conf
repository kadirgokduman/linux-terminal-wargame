#!/usr/sbin/nft -f
#
# wargame — düğüm güvenlik duvarı
#
#   nft -c -f deploy/nftables.conf     # ÖNCE KONTROL ET (hiçbir şey uygulanmaz)
#   nft -f    deploy/nftables.conf
#   nft list ruleset
#
# Amaç: oyuncu konteynerlerinin dış internete çıkmasını engellemek.
# Oyuncular gerçek bir kabuk alıyor; kripto madenciliği, port taraması ve
# DDoS için atlama taşı olarak kullanılmaları engellenmeli.
#
# UYARI: `input` zinciri policy drop ile çalışır. Uygulamadan önce
# yönetim SSH portunuzu aşağıdaki kümeye ekleyin, aksi halde sunucuya
# erişiminizi kaybedersiniz. `nft -c -f` bu yüzden zorunlu adımdır.

table inet wargame {
    # Konteyner ağları. compose.yaml dosyalarındaki WARGAME_SUBNET ile
    # eşleşmeli: varsayılan 172.28, test 172.29, sertleştirilmiş 172.30.
    set container_net {
        type ipv4_addr
        flags interval
        elements = { 172.28.0.0/16, 172.29.0.0/16, 172.30.0.0/16 }
    }

    # Düğümün kendisine gelen trafik.
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # Yönetim SSH'i — kendi portunuzu buraya yazın.
        tcp dport 22 accept

        # Oyuncu SSH'i (varsayılan / sertleştirilmiş profil).
        tcp dport { 2222, 2223 } accept

        # Teşhis: ping.
        icmp type echo-request limit rate 5/second accept

        # Geri kalan her şey sessizce düşer; reddetme, tarama bilgisi vermez.
        counter drop
    }

    # Konteynerlerden geçen trafik.
    chain forward {
        type filter hook forward priority filter; policy drop;

        # Konteynerler birbirleriyle konuşabilir (tek konteyner olsa da
        # test projeleri ve gelecekteki servisler için gerekli).
        ip saddr @container_net ip daddr @container_net accept

        # Dışarıdan gelen SSH bağlantılarının dönüş trafiği.
        ct state established,related accept

        # Konteynerden başlatılan hiçbir yeni bağlantı çıkmaz.
        ip saddr @container_net counter drop
    }
}
