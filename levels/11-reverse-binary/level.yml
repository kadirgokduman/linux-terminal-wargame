flag:
  owner: player11
  mode: "0400"

hints:
  - "Biner mühürü içinde taşımıyor; bir dosyayı okuyup çözüyor. `ltrace` ne okuduğunu gösterir."
  - "`objdump -d ~/bin/checker | grep -i xor` — tek baytlık bir anahtar görünür."
  - "`ltrace -s 200 -e strcmp ~/bin/checker x` karşılaştırmadaki düz metni basar."

