# wargame — kullanıcı başına kaynak sınırları (pam_limits)
#
# Tek konteynerde yüzlerce oyuncu olabilir; bir oyuncunun fork bombası
# diğerlerini düşürmemelidir.

*    soft nproc    64
*    hard nproc    128
*    soft nofile   256
*    hard nofile   1024
*    hard fsize    51200
*    hard core     0
*    hard maxlogins 3
