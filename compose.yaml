name: wargame

services:
  sandbox:
    build:
      context: .
      dockerfile: docker/base.Dockerfile
    image: wargame/base:1.0
    hostname: ${WARGAME_HOSTNAME:-repository}
    restart: unless-stopped

    ports:
      # Bound to localhost by default: intended for local development.
      # In production, set WARGAME_HOST=0.0.0.0 and place a reverse proxy / firewall in front.
      - "${WARGAME_HOST:-127.0.0.1}:${WARGAME_PORT:-2222}:22"

    environment:
      WARGAME_EPOCH: ${WARGAME_EPOCH:-dev}

    secrets:
      - wargame_secret

    # read_only: true is INTENTIONALLY DISABLED.
    # sshd and PAM must write to /etc/shadow and /etc/passwd on every login;
    # a read-only root filesystem breaks the password chain.
    # Mitigations: minimal capabilities, tmpfs mounts, resource limits,
    # single-use image (make down && make up resets everything), and
    # disabling external network access.
    volumes:
      - home:/home
      - spool:/var/spool/wargame
      - logs:/var/log/wargame

    tmpfs:
      - /tmp:rw,exec,nosuid,size=256m
      - /run:rw,noexec,nosuid,size=64m

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
      - AUDIT_WRITE
      # sshd chroots its privileged pre-auth process into /run/sshd;
      # without this capability all connections fail at preauth.
      - SYS_CHROOT

    security_opt:
      # Levels teach the SUID bit; no-new-privileges would make that mechanism
      # impossible. Isolation is enforced at the container boundary instead.
      - no-new-privileges:false

    # Resource caps to prevent a single player from taking down the server.
    pids_limit: 512
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0
    ulimits:
      nofile:
        soft: 1024
        hard: 4096
      nproc: 256
      core: 0

    stop_grace_period: 5s

    healthcheck:
      # Read the SSH banner: verifies that sshd is actually responding,
      # not just that the port is open (and avoids reset noise in the log).
      test: ["CMD-SHELL", "nc -w 2 127.0.0.1 22 | head -c 3 | grep -q SSH"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    # Fixed subnet: firewall rules are written against this range.
    # Test deployments can override it with WARGAME_SUBNET.
    ipam:
      config:
        - subnet: ${WARGAME_SUBNET:-172.28.0.0/16}

volumes:
  home:
  spool:
  logs:

secrets:
  wargame_secret:
    file: ${WARGAME_SECRET_FILE:-./docker/secrets/wargame_secret}
